<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Alfabetização</title>
    <link rel="stylesheet" href="teste.css">
</head>
<body>
    <div class="container">
        <h1>Qual dessas frutas começa com a letra M?</h1>
        <div class="card-container">
            <div class="card" data-resposta="errada">
                <img src="maca.png" alt="Maçã">
                <p>Maçã</p>
            </div>
            <div class="card" data-resposta="certa">
                <img src="morango.png" alt="Morango">
                <p>Morango</p>
            </div>
            <div class="card" data-resposta="errada">
                <img src="banana.png" alt="Banana">
                <p>Banana</p>
            </div>
        </div>
    </div>
    <script src="jogo-teste.js"></script>
</body>
</html>
